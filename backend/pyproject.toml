[project]
name = "onset-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "python-multipart",
    "pandas",
    "numpy",
    "owlready2",
    "networkx",
    "pyvis",
    "rdflib[networkx,networkx,html,lxml]>=7.1.1",
    "fastapi",
    "psycopg[binary]>=3.2.9",
    "sentence-transformers>=4.1.0,<5.0.0",
    "SQLAlchemy",
    "sqlmodel",
    "torch",
    "jupyter",
    "ipywidgets",
    "transformers",
    "bertopic",
    "pgvector",
    "cachetools",
    "redis-om",
    "matplotlib",
    "llvmlite>=0.45.0",
    "llama-cpp-agent",
    "seqeval",
    "sparql-llm>=0.0.3",
    "langchain>=0.3.14",
    "langchain-huggingface>=0.1.2",
    "langchain-community>=0.3.14",
    "qlever>=0.5.15",
    "qdrant-client>=1.13.0",
    "sparqlwrapper>=2.0.0",
    "openai>=1.59.9",
    # "onnxruntime-gpu",6
    # "fastembed-gpu",
    "line-profiler>=4.2.0",
    "json-repair>=0.46.0",
    "tikzplotlib-patched",
    "seaborn>=0.13.2",
    "scipy>=1.15.2",
    "llama-cpp-python>=0.3.9",
    "baycomp>=1.0.3",
    "pingouin>=0.5.5",
]

[project.optional-dependencies]
dev = [
    "tuna>=0.5.11",
]

[tool.uv.sources]
torch = [
    { index = "torch-metal", marker = "platform_system != 'Linux'" },
    { index = "torch-gpu", marker = "platform_system == 'Linux'" },
]
llama-cpp-agent = [
    { git = "https://github.com/Dakantz/llama-cpp-agent.git", branch = "add-literal-support" },
]
tikzplotlib-patched = [
    { git = "https://github.com/JasonGross/tikzplotlib.git", branch = "patched" },
]

[[tool.uv.index]]
name="torch-metal"
url="https://download.pytorch.org/whl/cpu/"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

